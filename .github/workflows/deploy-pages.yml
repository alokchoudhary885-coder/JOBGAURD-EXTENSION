name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Extension
        working-directory: ./extension
        run: |
          npm install
          npm run build

      - name: Prepare Pages Directory
        run: |
          mkdir -p pages
          cp -r extension/dist pages/
          cp README.md pages/

      - name: Generate Landing Page
        run: |
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>JobGuard Extension - Build Artifacts</title>
            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 40px 20px;
                display: flex;
                align-items: center;
                justify-content: center;
              }
              .container {
                background: white;
                border-radius: 12px;
                padding: 40px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                max-width: 800px;
                width: 100%;
              }
              h1 {
                color: #667eea;
                margin-bottom: 10px;
                font-size: 32px;
              }
              .subtitle {
                color: #666;
                font-size: 16px;
                margin-bottom: 30px;
              }
              .info-box {
                background: #f0f4ff;
                border-left: 4px solid #667eea;
                padding: 20px;
                margin: 20px 0;
                border-radius: 4px;
                line-height: 1.6;
              }
              .files-section {
                margin-top: 30px;
              }
              .files-section h2 {
                font-size: 20px;
                color: #333;
                margin-bottom: 15px;
              }
              .file-list {
                list-style: none;
                padding: 0;
              }
              .file-list li {
                padding: 15px;
                background: #f8f9fa;
                margin: 10px 0;
                border-radius: 4px;
                border-left: 4px solid #667eea;
                transition: background 0.2s;
              }
              .file-list li:hover {
                background: #f0f4ff;
              }
              .file-list a {
                color: #667eea;
                text-decoration: none;
                font-weight: 500;
                font-size: 16px;
              }
              .file-list a:hover {
                text-decoration: underline;
              }
              .file-desc {
                margin: 8px 0 0 0;
                color: #666;
                font-size: 14px;
                line-height: 1.4;
              }
              .build-info {
                background: #f9fafb;
                padding: 20px;
                border-radius: 4px;
                margin-top: 20px;
                border: 1px solid #e5e7eb;
              }
              .build-info h3 {
                font-size: 16px;
                margin-bottom: 12px;
                color: #333;
              }
              .build-info p {
                margin: 8px 0;
                color: #555;
                font-size: 14px;
                line-height: 1.6;
              }
              code {
                background: #f5f5f5;
                padding: 2px 6px;
                border-radius: 3px;
                font-family: 'Courier New', monospace;
                font-size: 13px;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🛡️ JobGuard Extension</h1>
              <p class="subtitle">Chrome Extension Build Artifacts - Auto-deployed from main branch</p>

              <div class="info-box">
                <strong>📦 Extension Build Output:</strong>
                <p>The compiled extension files are available in the <code>dist/</code> directory below. These are the production-ready artifacts built from the source code.</p>
              </div>

              <div class="files-section">
                <h2>Available Artifacts</h2>
                <ul class="file-list">
                  <li>
                    <a href="dist/">📁 dist/ - Compiled Extension Files</a>
                    <p class="file-desc">
                      Contains the built Chrome Extension (Manifest V3) with all compiled JavaScript, assets, and manifest configuration ready for deployment.
                    </p>
                  </li>
                  <li>
                    <a href="README.md">📄 README.md - Project Documentation</a>
                    <p class="file-desc">
                      Complete project documentation including features, installation instructions, architecture overview, and development guide.
                    </p>
                  </li>
                </ul>
              </div>

              <div class="build-info">
                <h3>⚙️ Build Details</h3>
                <p>
                  <strong>Source:</strong> <code>extension/</code> directory<br>
                  <strong>Build System:</strong> Vite + TypeScript<br>
                  <strong>Output Directory:</strong> <code>extension/dist/</code><br>
                  <strong>Deployment:</strong> Automatic on push to main branch via GitHub Actions
                </p>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4